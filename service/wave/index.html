<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WAVES — 永遠に流れ続ける海</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: auto; }
  .hint {
    position: fixed; bottom: 28px; left: 0; right: 0;
    text-align: center; color: rgba(255,255,255,.35);
    font-family: serif; font-size: 12px; letter-spacing: .35em;
    animation: fade 20s ease-in-out infinite;
    pointer-events: none;
    mix-blend-mode: overlay;
  }
  @keyframes fade { 0%,100% { opacity: .08 } 50% { opacity: .4 } }
</style>
</head>
<body>
<canvas id="sea"></canvas>
<div class="hint">scroll · drift</div>
<script>
// WAVES のエンドロール風。色「玉」ではなく、
// 勾配そのものが画面全体でうねり、色がゆっくり流れるフィールド方式。
// 低解像度で計算して拡大表示する（なめらかな滲みはブラウザの補間に任せる）。

const canvas = document.getElementById('sea');
const ctx = canvas.getContext('2d');

// 計算用の低解像度バッファ（拡大すると自然にボケて滲む）
let fw, fh, buf, bufCtx, img;
function setup() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fw = 80;                                   // 計算幅（小さいほど滲む）
  fh = Math.round(fw * innerHeight / innerWidth);
  buf = document.createElement('canvas');
  buf.width = fw; buf.height = fh;
  bufCtx = buf.getContext('2d');
  img = bufCtx.createImageData(fw, fh);
}
window.addEventListener('resize', setup);
setup();

// 4色（暖色2 + 寒色2）。固定の組み合わせではなく、
// 一定時間ごとにランダムに新しい組み合わせを生成してゆっくり交叉する。
// 基準の色相もばらすので、「青のライン」のような定型的な模様が出にくい。
const SEGMENT = 240;        // 1つの組み合わせの寿命（秒）

function hsl(h, s, l) {
  h = ((h % 360) + 360) % 360;
  const a = s * Math.min(l, 1 - l);
  const f = n => {
    const k = (n + h / 30) % 12;
    return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
  };
  return [f(0) * 255, f(8) * 255, f(4) * 255];
}

function rand(a, b) { return a + Math.random() * (b - a); }

function hx(c) { const n = parseInt(c.slice(1), 16); return [n>>16&255, n>>8&255, n&255]; }
function mix(c1, c2, k) {
  // 配列（rgb）にもhex文字列にも対応
  const a = Array.isArray(c1) ? c1 : hx(c1);
  const b = Array.isArray(c2) ? c2 : hx(c2);
  return [a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k, a[2]+(b[2]-a[2])*k];
}
function ease(k) { return k * k * (3 - 2 * k); }

// ランダムに4色を生成。暖色2＋寒色2。
// 1/3ぐらいの確率で「赤が主役」の組み合わせが来るようにする。
function makeQuad() {
  const redLead = Math.random() < 0.35;
  const warmHue1 = redLead ? rand(-12, 18) : rand(5, 45);        // 赤寄り or オレンジ〜ピーチ
  const warmHue2 = warmHue1 + rand(10, 35);
  const coolHue1 = rand(160, 230);
  const coolHue2 = coolHue1 + rand(-25, 25);
  return [
    hsl(warmHue1, redLead ? rand(0.4, 0.55) : rand(0.3, 0.5), redLead ? rand(0.7, 0.8) : rand(0.78, 0.86)),
    hsl(warmHue2, rand(0.22, 0.4),  rand(0.84, 0.9)),
    hsl(coolHue1, rand(0.3, 0.5),  rand(0.78, 0.86)),
    hsl(coolHue2, rand(0.22, 0.42),  rand(0.82, 0.88)),
  ];
}

let curQuad = makeQuad();
let nextQuad = makeQuad();
let curIdx = -1;

function palette(t) {
  // セグメントの後半30%で次の組み合わせへゆっくり交叉
  const idx = Math.floor(t / SEGMENT);
  if (idx !== curIdx) {
    curIdx = idx;
    curQuad = nextQuad;
    nextQuad = makeQuad();
  }
  const seg = t % SEGMENT;
  const k = ease(Math.max(0, (seg - SEGMENT * 0.7) / (SEGMENT * 0.3)));
  return [0, 1, 2, 3].map(x => mix(curQuad[x], nextQuad[x], k));
}

let lastT = performance.now();
let flow = 0;          // 下流へのオフセット（累積）
let userFlow = 0;

// 斜め方向を時間でゆっくり回転させる（固定の斜め縞を見えなくする）
function rot(x, y, t, speed, seed) {
  const a = t * speed + seed;
  const c = Math.cos(a), s = Math.sin(a);
  return [x * c - y * s, x * s + y * c];
}

function field(x, y, t) {
  // 複数の波源が重なったスカラー場。うずまきで座標を歪ませて勾配をねじる
  const sw = Math.sin(y * 0.9 + t * 0.065) * 1.4 + Math.sin(y * 1.7 - t * 0.035) * 0.7;
  const xs = x + sw;
  const [rx, ry] = rot(xs, y, t, 0.011, 0.7);
  return (
    Math.sin(xs * 2.1 + t * 0.10 + Math.sin(y * 1.3 - t * 0.055) * 1.2) * 0.45
  + Math.sin(y * 1.7 - t * 0.035 + Math.sin(xs * 0.9 + t * 0.035) * 1.6) * 0.35
  + Math.sin((rx + ry) * 1.1 + t * 0.045) * 0.25
  + Math.sin((rx - ry * 0.6) * 2.6 - t * 0.085) * 0.15
  );
}

function field2(x, y, t) {
  // 1つめの場とは位相・周波数が異なる独立した場。逆向きのうずを入れる
  const sw = Math.sin(x * 1.1 - t * 0.055) * 1.2 + Math.cos(y * 0.8 + t * 0.045) * 0.9;
  const ys = y + sw;
  const [rx, ry] = rot(x, ys, t, -0.009, 2.3);
  return (
    Math.sin(x * 1.6 - t * 0.075 + Math.sin(ys * 2.0 + t * 0.025) * 1.4) * 0.40
  + Math.sin(ys * 1.1 + t * 0.09 + Math.sin(x * 1.4 - t * 0.03) * 1.1) * 0.35
  + Math.sin((rx * 0.8 - ry) * 1.5 + t * 0.06) * 0.25
  );
}

function field3(x, y, t) {
  // 暖色2色目用の場。逆向きの回転とうずを持つ
  const sw = Math.sin(x * 0.8 + t * 0.05) * 1.1 + Math.sin(y * 1.4 - t * 0.04) * 0.8;
  const [rx, ry] = rot(x + sw, y, t, 0.014, 4.1);
  return (
    Math.sin(rx * 1.4 + ry * 1.0 + t * 0.08) * 0.5
  + Math.sin(rx * 0.6 - ry * 1.3 - t * 0.05 + Math.sin(t * 0.025) * 1.2) * 0.5
  );
}

function field4(x, y, t) {
  // 寒色2色目用の場。また別の向き・周期
  const sw = Math.cos(x * 1.2 + t * 0.045) * 1.0;
  const [rx, ry] = rot(x, y + sw, t, -0.012, 5.9);
  return (
    Math.sin(rx * 1.2 - ry * 1.1 + t * 0.06) * 0.5
  + Math.sin(rx * 1.8 + ry * 0.7 + t * 0.04) * 0.5
  );
}

// --- RGBチャンネルを互い違いにずらすパターン3種 ---
// 各チャンネルの色の重心が別々の場所で決まるので、虹色の縁取りのような
// 干渉が生まれる。パターンは一定間隔でランダムに切り替わる。
const CH_PATTERNS = [
  [ [ 0.70,  0.40], [ 0.00,  0.00], [-0.70, -0.40] ],   // 斜めに開く
  [ [-0.55,  0.60], [ 0.45, -0.30], [ 0.00, -0.65] ],   // 三つ葉にずれる
  [ [ 0.80,  0.00], [-0.80,  0.55], [ 0.25, -0.80] ],   // 横に流れる
];
const PAT_LIFE = 100;      // パターンの寿命（秒）
let curPat = 0, nextPat = Math.floor(Math.random() * 3), patStart = 0;

function channelOffsets(t) {
  const idx = Math.floor(t / PAT_LIFE);
  if (idx !== patStart) { patStart = idx; curPat = nextPat; nextPat = Math.floor(Math.random() * CH_PATTERNS.length); }
  const seg = t % PAT_LIFE;
  const k = ease(Math.max(0, (seg - PAT_LIFE * 0.7) / (PAT_LIFE * 0.3)));
  const a = CH_PATTERNS[curPat], b = CH_PATTERNS[nextPat];
  return [0, 1, 2].map(c => [a[c][0] + (b[c][0] - a[c][0]) * k, a[c][1] + (b[c][1] - a[c][1]) * k]);
}

function draw(now) {
  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;
  const t = now / 1000;

  flow += dt * 0.09 + userFlow;     // 場全体が下へ流れる
  userFlow *= 0.96;

  const [A0, A2, B, C] = palette(t);

  // たまに（約2分に1回、20秒ほど）強い赤が潮のように差し込む
  const pulsePhase = (t % 120) / 120;
  const pulse = Math.max(0, Math.sin(pulsePhase * Math.PI * 2 - 1.2)) ** 3;  // 短く鋭く立ち上がる
  const VIVID = [242, 110, 100];   // サンゴのような強い赤
  const A = [
    A0[0] + (VIVID[0] - A0[0]) * pulse * 0.85,
    A0[1] + (VIVID[1] - A0[1]) * pulse * 0.85,
    A0[2] + (VIVID[2] - A0[2]) * pulse * 0.85,
  ];

  const d = img.data;
  let p = 0;
  const offs = channelOffsets(t);
  for (let j = 0; j < fh; j++) {
    const y = j / fh * 0.5 - flow;
    for (let i = 0; i < fw; i++) {
      const x = i / fw * 0.5;
      // チャンネルごとに位置をわずかにずらして softmax → RGBの縁が互い違いに動く
      const cols = [A, A2, B, C];
      const sharp = 4.5;
      const rgb = [0, 0, 0];
      for (let c = 0; c < 3; c++) {
        const ox = x + offs[c][0], oy = y + offs[c][1];
        const F = [field(ox, oy, t), field3(ox, oy, t), field2(ox, oy, t), field4(ox, oy, t)];
        const m = Math.max(F[0], F[1], F[2], F[3]);
        let sum = 0;
        for (const f of F) sum += Math.exp((f - m) * sharp);
        for (let k2 = 0; k2 < 4; k2++) {
          rgb[c] += cols[k2][c] * Math.exp((F[k2] - m) * sharp) / sum;
        }
      }
      d[p++] = rgb[0]; d[p++] = rgb[1]; d[p++] = rgb[2]; d[p++] = 255;
    }
  }
  bufCtx.putImageData(img, 0, 0);

  // 拡大描画（スムージングで自然に滲む）
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(buf, 0, 0, canvas.width / Math.min(window.devicePixelRatio || 1, 2), canvas.height / Math.min(window.devicePixelRatio || 1, 2));

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// --- 操作：スクロール / ドラッグで流れが速くなる ---
function boost(a) { userFlow = Math.max(-0.4, Math.min(0.8, userFlow + a * 0.0006)); }
window.addEventListener('wheel', e => boost(e.deltaY * 0.06), { passive: true });
let py = null;
window.addEventListener('touchstart', e => { py = e.touches[0].clientY; }, { passive: true });
window.addEventListener('touchmove', e => { if (py !== null) { boost((py - e.touches[0].clientY) * 0.02); py = e.touches[0].clientY; } }, { passive: true });
window.addEventListener('touchend', () => { py = null; });
let dy = null;
window.addEventListener('mousedown', e => { dy = e.clientY; });
window.addEventListener('mousemove', e => { if (dy !== null) { boost(dy - e.clientY); dy = e.clientY; } });
window.addEventListener('mouseup', () => { dy = null; });
</script>
</body>
</html>
